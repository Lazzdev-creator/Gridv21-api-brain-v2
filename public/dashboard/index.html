<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRIDV21 Brain v6.0.6</title>
  <link rel="stylesheet" href="./styles.css"> <!-- FIXED PATH -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>GRIDV21 BRAIN</h1>
      <p class="version">v6.0.6 | 12 OS Operating System</p>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <h3>Total Leads</h3>
        <p id="total-leads">0</p>
      </div>
      <div class="metric-card">
        <h3>OS Active</h3>
        <p id="os-active">0/12</p>
      </div>
      <div class="metric-card">
        <h3>Est Revenue/Month</h3>
        <p id="est-revenue">$0</p>
      </div>
      <div class="metric-card">
        <h3>DMs Sent</h3>
        <p id="dms-sent">0</p>
      </div>
    </div>

    <div class="controls">
      <button id="run-scan-btn" class="btn-primary">🔄 Run Scan</button>
      <button id="refresh-btn" class="btn-secondary">↻ Refresh</button>
    </div>

    <div class="section">
      <h2>12 OS Modules</h2>
      <div id="os-grid" class="os-grid"></div>
    </div>

    <div class="section">
      <h2>Latest Permits</h2>
      <div id="permits-table"></div>
    </div>

    <div id="toast"></div>
  </div>

  <script src="./app.js"></script> <!-- FIXED PATH -->
</body>
</html>
