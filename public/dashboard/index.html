<!DOCTYPE html>
<html lang="en">
<head><style>
body { font-family: system-ui; background:#0b0c10; color:#fff; margin:0; padding:20px; }
header { display:flex; justify-content:space-between; margin-bottom:20px; }
.kpi-card, .card { background:#1f2833; padding:12px; border-radius:12px; border:1px solid #45a29e; margin-bottom:12px; }
button { background:#45a29e; border:none; padding:10px 16px; border-radius:8px; color:#fff; }
.metrics { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
      </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRIDV21 Enterprise Brain v6.0.2</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>GRIDV21 Brain v6.0.2</h1>
    <div class="btn-group">
      <button onclick="forceScan()">🔄 Run Scan</button>
      <button onclick="checkEngine()">🧠 AI Health</button>
    </div>
  </header>

  <div class="container">
    <section class="metrics">
      <div class="kpi-card"><b>Total Leads</b><div id="total_leads">0</div></div>
      <div class="kpi-card"><b>Revenue MTD</b><div id="est_revenue">$0</div></div>
      <div class="kpi-card"><b>OS Active</b><div id="os_active">0/12</div></div>
      <div class="kpi-card"><b>DMS Sent</b><div id="dms_sent">0</div></div>
    </section>

    <h2 class="section-title">Permit Intelligence Feed</h2>
    <div id="data" class="grid"></div>

    <h2 class="section-title">12 Operating Systems Control Center</h2>
    <div id="os_grid" class="grid"></div>

    <!-- FIX 6: Activity Log -->
    <h2 class="section-title">Activity Log</h2>
    <div id="activity" class="grid"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
