<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>GRIDV21 BRAIN v6.2.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #05050a; color: #e5e7eb; }
   .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(59, 130, 246, 0.1); }
   .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
   .kpi-card { transition: all 0.3s; }
   .kpi-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
  </style>
</head>
<body>
  <!-- TOP NAV + ACTION BAR -->
  <nav class="glass fixed top-0 w-full z-50 px-6 py-2 flex justify-between items-center">
    <div class="flex items-center gap-3"><div class="w-8 h-8 bg-gradient-to-r from-blue-600 to-purple-600 rounded"></div><h1 class="text-lg font-bold">GRIDV21 BRAIN <span class="text-xs text-gray-400">v6.2.1</span></h1></div>
    <div class="flex gap-4 text-sm">
      <a class="text-blue-400">Dashboard</a><a>OS</a><a>Leads</a><a>AI</a><a>Settings</a>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="runBrain()" class="bg-green-600 px-3 py-1 rounded text-xs">▶ Run Brain</button>
      <button onclick="pauseBrain()" class="bg-yellow-600 px-3 py-1 rounded text-xs">⏸ Pause</button>
      <button onclick="emergencyStop()" class="bg-red-600 px-3 py-1 rounded text-xs">🚨 E-Stop</button>
      <button onclick="toggleTheme()" class="text-gray-400">🌙</button>
    </div>
  </nav>

  <div class="flex pt-14">
    <!-- LEFT SIDEBAR -->
    <aside class="w-56 glass h-screen fixed left-0 p-3 overflow-y-auto text-xs">
      <div id="sidebar-os" class="space-y-1"></div>
    </aside>

    <main class="ml-56 flex-1 p-4">
      <!-- 12 KPI CARDS -->
      <div id="kpi-grid" class="grid grid-cols-6 gap-3 mb-4"></div>

      <div class="grid grid-cols-4 gap-4">
        <!-- CENTER: INTELLIGENCE PANEL WITH TABS -->
        <div class="col-span-3 space-y-4">
          <div class="glass p-4 rounded-lg">
            <div class="flex gap-6 border-b border-gray-800 mb-3 text-xs">
              <button class="tab-active pb-2" onclick="switchTab('activity')">Activity</button>
              <button onclick="switchTab('ai')">AI Decisions</button>
              <button onclick="switchTab('revenue')">Revenue</button>
              <button onclick="switchTab('security')">Security</button>
              <button onclick="switchTab('logs')">Scan Logs</button>
            </div>
            <div id="tab-content" class="h-80 overflow-y-auto text-xs"></div>
          </div>

          <!-- 6 CHARTS -->
          <div class="grid grid-cols-3 gap-3">
            <div class="glass p-3 rounded-lg"><canvas id="chart1"></canvas></div>
            <div class="glass p-3 rounded-lg"><canvas id="chart2"></canvas></div>
            <div class="glass p-3 rounded-lg"><canvas id="chart3"></canvas></div>
            <div class="glass p-3 rounded-lg"><canvas id="chart4"></canvas></div>
            <div class="glass p-3 rounded-lg"><canvas id="chart5"></canvas></div>
            <div class="glass p-3 rounded-lg"><canvas id="chart6"></canvas></div>
          </div>

          <!-- LEAD INTELLIGENCE TABLE -->
          <div class="glass p-4 rounded-lg">
            <div class="flex justify-between mb-3">
              <input id="search" placeholder="Search permits..." class="bg-gray-900 p-2 rounded text-xs w-64">
              <button onclick="exportCSV()" class="bg-blue-600 px-3 py-1 rounded text-xs">Export CSV</button>
            </div>
            <table class="w-full text-xs"><thead><tr class="text-gray-400"><th>Permit</th><th>City</th><th>Address</th><th>Value</th><th>AI Score</th><th>Revenue Pred</th><th>Actions</th></tr></thead><tbody id="permit-table"></tbody></table>
          </div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="space-y-4">
          <div class="glass p-3 rounded-lg"><h3 class="font-bold text-sm mb-2">System Health</h3><div id="system-health" class="space-y-1 text-xs"></div></div>
          <div class="glass p-3 rounded-lg"><h3 class="font-bold text-sm mb-2">AI Command Center</h3><div id="ai-panel" class="space-y-1 text-xs"></div></div>
          <div class="glass p-3 rounded-lg"><h3 class="font-bold text-sm mb-2">Automation</h3>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <button onclick="runScan()" class="bg-blue-600 p-1 rounded">Full Scan</button>
              <button class="bg-purple-600 p-1 rounded">AI Engine</button>
              <button class="bg-gray-700 p-1 rounded">Backup DB</button>
              <button class="bg-gray-700 p-1 rounded">Restart Brain</button>
            </div>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <footer class="text-center text-xs text-gray-500 mt-6">v6.2.1 | Production | us-east-1 | Last Scan: <span id="last-scan">-</span></footer>
    </main>
  </div>

<script>
const API = '/api';
let charts = {};

async function loadAll() {
  const [dash, status, os, ai, chartsData] = await Promise.all([
    fetch(`${API}/dashboard`).then(r => r.json()),
    fetch(`${API}/status`).then(r => r.json()),
    fetch(`${API}/os`).then(r => r.json()),
    fetch(`${API}/ai`).then(r => r.json()),
    fetch(`${API}/charts`).then(r => r.json())
  ]);

  // 12 KPI Cards
  document.getElementById('kpi-grid').innerHTML = `
    ${['Total Leads','New Today','Monthly Revenue','Active OS','AI Decisions','System Health','CPU','Memory','API Calls','Scan Queue','AI Confidence','Active Users'].map((k,i) => `
      <div class="glass kpi-card p-3 rounded-lg"><div class="text-xs text-gray-400">${k}</div><div class="text-xl font-bold">${Object.values(dash.metrics)[i] || '0'}</div></div>
    `).join('')}
  `;

  // OS Control Cards
  document.getElementById('sidebar-os').innerHTML = os.os.map(o => `
    <div class="glass p-2 rounded flex items-center justify-between">
      <span>${o.name}</span>
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full ${o.status==='active'?'bg-green-400':'bg-gray-500'}"></div>
        <button class="text-xs">⚙</button>
      </div>
    </div>
  `).join('');

  // System Health
  document.getElementById('system-health').innerHTML = Object.entries(status.services).map(([k,v]) => `<div>✓ ${k}: <span class="text-green-400">${v}</span></div>`).join('');
  
  // AI Panel
  document.getElementById('ai-panel').innerHTML = Object.entries(ai.ai).map(([k,v]) => `<div>${k}: <span class="text-blue-400">${v}</span></div>`).join('');

  // Charts
  renderCharts(chartsData.charts);
}

function renderCharts(data) {
  const ctx1 = document.getElementById('chart1');
  new Chart(ctx1, {type: 'line', data: {labels: ['Jan','Feb','Mar','Apr','May','Jun'], datasets: [{label: 'Permits', data: data.permit_growth, borderColor: '#3b82f6'}]}, options: {plugins: {legend: {display: false}}}});
  // repeat for chart2-6...
}

async function runBrain() { await fetch(`${API}/scrape-now`, {method: 'POST'}); }
async function pauseBrain() { await fetch(`${API}/brain/pause`, {method: 'POST'}); }
async function emergencyStop() { await fetch(`${API}/brain/emergency-stop`, {method: 'POST'}); }
function switchTab(tab) { document.getElementById('tab-content').innerHTML = `<div>Loading ${tab}...</div>`; }
setInterval(loadAll, 5000);
loadAll();
</script>
</body>
                                                                    </html>
