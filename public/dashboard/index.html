<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRIDV21 Brain Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="panel" style="padding:20px;">
    <header style="display:flex; justify-content:space-between; align-items:center;">
      <h1>GRIDV21 Brain v5.5.11</h1>
      <div>
        <button onclick="forceScan()">🔄 Run Scan</button>
        <button onclick="checkEngine()">🧠 Health</button>
      </div>
    </header>

    <section class="metrics">
      <div class="card"><b>Total Leads</b><div id="total_leads">0</div></div>
      <div class="card"><b>Revenue MTD</b><div id="est_revenue">$0</div></div>
      <div class="card"><b>OS Active</b><div id="os_active">0</div></div>
      <div class="card"><b>DMS Sent</b><div id="dms_sent">0</div></div>
    </section>

    <h2>Recent Permits</h2>
    <div id="data" class="grid"></div>

    <h2>12 OS Modules</h2>
    <div id="os_grid" class="grid"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
