<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRIDV21 Brain Dashboard</title>

<link rel="stylesheet" href="/dashboard/styles.css">

</head>

<body>

<header>

<h1>GRIDV21 BRAIN v6.1.10</h1>

<div>

<span id="health" class="status">Checking...</span>

<button id="scanBtn">
Run Scan
</button>

</div>

</header>

<div class="container">

<div class="grid">

<div class="card">
<h2>Total Leads</h2>
<div id="totalLeads" class="metric">0</div>
</div>

<div class="card">
<h2>Monthly Revenue</h2>
<div id="revenue" class="metric">$0</div>
</div>

<div class="card">
<h2>Brain OS Active</h2>
<div id="osActive" class="metric">0</div>
</div>

<div class="card">
<h2>AI Confidence</h2>
<div id="confidence" class="metric">0%</div>
</div>

</div>

<div class="section">

<h2>Latest Permits</h2>

<table>

<thead>

<tr>
<th>City</th>
<th>Permit</th>
<th>Status</th>
<th>AI Score</th>
</tr>

</thead>

<tbody id="permitsTable">

<tr>

<td colspan="4" class="loading">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

<div class="section">

<h2>Operating Systems</h2>

<div id="osGrid" class="os-grid">

<div class="loading">

Loading...

</div>

</div>

</div>

<div class="section">

<h2>Recent Scan Logs</h2>

<table>

<thead>

<tr>

<th>Started</th>

<th>Status</th>

<th>Permits</th>

<th>Errors</th>

</tr>

</thead>

<tbody id="scanTable">

<tr>

<td colspan="4" class="loading">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script src="/dashboard/app.js"></script>

</body>
  </html>
