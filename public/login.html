<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GRIDV21 Secure Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101a31;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #15213d;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      color: #aeb8d0;
      font-size: 20px;
      margin: 20px 0 35px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #cbd3e6;
      font-size: 17px;
    }

    input {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid #27385f;
      background: #202e50;
      color: white;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #0aa9ff;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 18px;
      border: 0;
      border-radius: 16px;
      background: #079eea;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: #080d1b;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .success {
      color: #58e38b;
    }

    .error {
      color: #ff6b6b;
    }

    .warning {
      color: #ffd166;
    }

    .info {
      color: #55bfff;
    }

    .diagnostics {
      margin-top: 20px;
      padding: 18px;
      background: #080d1b;
      border-radius: 14px;
    }

    .diagnostics h3 {
      color: #00aaff;
      margin-top: 0;
    }

    .step {
      margin: 10px 0;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #71809e;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>GRIDV21</h1>

  <div class="subtitle">
    Brain Enterprise — Secure Sign In
  </div>

  <label for="email">Email address</label>

  <input
    id="email"
    type="email"
    autocomplete="email"
    placeholder="Enter your email"
  >

  <label for="password">Password</label>

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Enter your password"
  >

  <button id="loginBtn" onclick="login()">
    Access GRIDV21
  </button>

  <div id="status" class="info">
    Initialising GRIDV21 authentication diagnostics...
  </div>

  <div class="diagnostics">

    <h3>GRIDV21 AUTHENTICATION DIAGNOSTICS</h3>

    <div id="diagnostics">
      Waiting for diagnostic tests...
    </div>

  </div>

  <div class="footer">
    🔒 Secure authentication powered by Supabase
    <br><br>
    GRIDV21 VC MASTER BUILD V1
  </div>

</div>


<!-- ============================================================
     SUPABASE LIBRARY
     ============================================================ -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  id="supabase-cdn">
</script>


<script>

"use strict";

/* ============================================================
   GRIDV21 SUPABASE CONFIGURATION
   ============================================================ */

/*
 IMPORTANT:

 Replace these two values.

 SUPABASE_URL:
 https://YOUR-PROJECT-ID.supabase.co

 SUPABASE_KEY:
 Use the PUBLIC / ANON / PUBLISHABLE key.

 NEVER put the service_role / secret key here.
*/

const SUPABASE_URL =
  "https://YOUR-PROJECT-ID.supabase.co";

const SUPABASE_KEY =
  "YOUR_PUBLIC_ANON_OR_PUBLISHABLE_KEY";


/* ============================================================
   ELEMENTS
   ============================================================ */

const statusBox =
  document.getElementById("status");

const diagnosticsBox =
  document.getElementById("diagnostics");

const loginButton =
  document.getElementById("loginBtn");


/* ============================================================
   DIAGNOSTIC LOGGER
   ============================================================ */

function log(message, type = "info") {

  const line = document.createElement("div");

  line.className = "step " + type;

  line.textContent = message;

  diagnosticsBox.appendChild(line);

  console.log("[GRIDV21]", message);
}


function setStatus(message, type = "info") {

  statusBox.className = type;

  statusBox.textContent = message;

}


/* ============================================================
   TEST 1 — BASIC BROWSER CONNECTIVITY
   ============================================================ */

async function testInternet() {

  log("1. Checking browser network access...");

  try {

    const response = await fetch(
      "https://www.google.com/favicon.ico",
      {
        method: "HEAD",
        mode: "no-cors",
        cache: "no-store"
      }
    );

    log(
      "PASS: Browser has network access.",
      "success"
    );

    return true;

  } catch (error) {

    log(
      "FAILED: Browser network request failed: " +
      error.message,
      "error"
    );

    return false;
  }
}


/* ============================================================
   TEST 2 — CHECK SUPABASE LIBRARY
   ============================================================ */

function testSupabaseLibrary() {

  log("2. Checking Supabase JavaScript library...");

  if (
    typeof window.supabase !== "undefined" &&
    typeof window.supabase.createClient === "function"
  ) {

    log(
      "PASS: Supabase JavaScript library loaded.",
      "success"
    );

    return true;

  }

  log(
    "FAILED: Supabase JavaScript library did not load.",
    "error"
  );

  return false;
}


/* ============================================================
   TEST 3 — FALLBACK TO UNPKG
   ============================================================ */

function loadFallbackCDN() {

  return new Promise((resolve) => {

    log(
      "3. jsDelivr failed. Trying unpkg fallback...",
      "warning"
    );

    const script =
      document.createElement("script");

    script.src =
      "https://unpkg.com/@supabase/supabase-js@2";

    script.onload = function() {

      if (
        typeof window.supabase !== "undefined" &&
        typeof window.supabase.createClient === "function"
      ) {

        log(
          "PASS: Supabase loaded through unpkg.",
          "success"
        );

        resolve(true);

      } else {

        log(
          "FAILED: unpkg loaded but Supabase object is unavailable.",
          "error"
        );

        resolve(false);
      }
    };

    script.onerror = function() {

      log(
        "FAILED: Both jsDelivr and unpkg are blocked or unreachable.",
        "error"
      );

      resolve(false);
    };

    document.head.appendChild(script);
  });
}


/* ============================================================
   TEST 4 — SUPABASE URL
   ============================================================ */

async function testSupabaseURL() {

  log("4. Testing Supabase project URL...");

  if (
    SUPABASE_URL.includes("YOUR-PROJECT-ID")
  ) {

    log(
      "FAILED: SUPABASE_URL has not been configured.",
      "error"
    );

    return false;
  }

  try {

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/health",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY
        },
        cache: "no-store"
      }
    );

    const text =
      await response.text();

    log(
      "Supabase HTTP status: " +
      response.status,
      response.ok ? "success" : "warning"
    );

    log(
      "Supabase response: " +
      text.substring(0, 300),
      "info"
    );

    return response.ok;

  } catch (error) {

    log(
      "FAILED: Cannot reach Supabase: " +
      error.message,
      "error"
    );

    return false;
  }
}


/* ============================================================
   TEST 5 — CREATE CLIENT
   ============================================================ */

function createSupabaseClient() {

  log("5. Creating Supabase client...");

  if (
    typeof window.supabase === "undefined"
  ) {

    throw new Error(
      "Supabase library is unavailable."
    );
  }

  if (
    !SUPABASE_URL ||
    SUPABASE_URL.includes("YOUR-PROJECT-ID")
  ) {

    throw new Error(
      "SUPABASE_URL is not configured."
    );
  }

  if (
    !SUPABASE_KEY ||
    SUPABASE_KEY.includes("YOUR_PUBLIC")
  ) {

    throw new Error(
      "SUPABASE_KEY is not configured."
    );
  }

  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true
        }
      }
    );

  log(
    "PASS: Supabase client created.",
    "success"
  );

  return client;
}


/* ============================================================
   GLOBAL CLIENT
   ============================================================ */

let supabaseClient = null;


/* ============================================================
   FULL DIAGNOSTIC
   ============================================================ */

async function runDiagnostics() {

  diagnosticsBox.innerHTML = "";

  setStatus(
    "Running Supabase connection diagnostics...",
    "info"
  );

  await testInternet();


  /* Check primary CDN */

  let libraryLoaded =
    testSupabaseLibrary();


  /* Try fallback */

  if (!libraryLoaded) {

    libraryLoaded =
      await loadFallbackCDN();
  }


  if (!libraryLoaded) {

    setStatus(
      "Supabase JavaScript library could not be loaded. " +
      "This is a CDN/network problem, not a login/password problem.",
      "error"
    );

    return;
  }


  /* Test Supabase itself */

  await testSupabaseURL();


  /* Create client */

  try {

    supabaseClient =
      createSupabaseClient();

    setStatus(
      "Supabase connection is ready. You can test login.",
      "success"
    );

  } catch (error) {

    log(
      "CLIENT ERROR: " +
      error.message,
      "error"
    );

    setStatus(
      "Supabase client configuration failed.",
      "error"
    );
  }
}


/* ============================================================
   LOGIN
   ============================================================ */

async function login() {

  if (!supabaseClient) {

    setStatus(
      "Supabase client is not ready. Check diagnostics first.",
      "error"
    );

    return;
  }


  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!email) {

    setStatus(
      "Enter your email address.",
      "warning"
    );

    return;
  }


  if (!password) {

    setStatus(
      "Enter your password.",
      "warning"
    );

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent =
    "Authenticating...";


  setStatus(
    "Contacting Supabase Authentication...",
    "info"
  );


  try {

    log(
      "6. Attempting Supabase email/password authentication..."
    );


    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    const data =
      result.data;

    const error =
      result.error;


    if (error) {

      log(
        "AUTH FAILED: " +
        error.message,
        "error"
      );

      if (error.status) {

        log(
          "HTTP status: " +
          error.status,
          "error"
        );
      }

      if (error.code) {

        log(
          "Supabase error code: " +
          error.code,
          "error"
        );
      }


      setStatus(
        "LOGIN FAILED\n\n" +
        error.message +
        "\n\nCode: " +
        (error.code || "N/A") +
        "\nStatus: " +
        (error.status || "N/A"),
        "error"
      );

      return;
    }


    if (
      data &&
      data.session &&
      data.user
    ) {

      log(
        "PASS: Authentication successful.",
        "success"
      );

      log(
        "User ID: " +
        data.user.id,
        "success"
      );

      log(
        "Email: " +
        data.user.email,
        "success"
      );


      setStatus(
        "LOGIN SUCCESSFUL\n\n" +
        "GRIDV21 authentication is working.\n\n" +
        "User: " +
        data.user.email,
        "success"
      );


      /*
       AFTER SUCCESSFUL LOGIN:

       Change this to your actual dashboard route.

       Example:
       window.location.href = "/dashboard";
      */

      setTimeout(() => {

        window.location.href =
          "/dashboard";

      }, 1500);

    } else {

      setStatus(
        "Supabase returned no session.",
        "warning"
      );

    }

  } catch (error) {

    log(
      "UNEXPECTED LOGIN ERROR: " +
      error.message,
      "error"
    );

    setStatus(
      "Unexpected authentication error:\n\n" +
      error.message,
      "error"
    );

  } finally {

    loginButton.disabled = false;

    loginButton.textContent =
      "Access GRIDV21";
  }
}


/* ============================================================
   START DIAGNOSTICS
   ============================================================ */

window.addEventListener(
  "load",
  runDiagnostics
);

</script>

</body>
  </html>
