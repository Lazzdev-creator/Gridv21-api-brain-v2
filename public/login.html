<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071126">

  <title>GRIDV21 — Secure Sign In</title>

  <style>

    /* =====================================================
       GRIDV21 LOGIN — RESPONSIVE BASE
       ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #071126;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0;
      padding:
        max(12px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 0%,
          #193363 0%,
          #0b1835 42%,
          #071126 75%,
          #040a18 100%
        );

      display: flex;
      justify-content: center;
      align-items: flex-start;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* =====================================================
       MAIN LOGIN CARD
       ===================================================== */

    .login-card {
      width: 100%;
      max-width: 560px;

      margin: 0 auto;

      padding: 28px 22px 32px;

      background:
        linear-gradient(
          145deg,
          rgba(22, 39, 76, 0.98),
          rgba(8, 18, 42, 0.98)
        );

      border: 1px solid rgba(80, 145, 225, 0.35);

      border-radius: 22px;

      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

      overflow: visible;
    }

    /* =====================================================
       BRAND
       ===================================================== */

    .brand {
      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      margin: 0 0 8px;
    }

    /* Built-in SVG logo.
       No external image or CDN required. */

    .grid-logo {
      width: 92px;
      height: 92px;

      display: block;

      flex: 0 0 auto;

      margin: 0 auto 8px;

      overflow: visible;
    }

    .brand-name {
      width: 100%;

      margin: 0;

      color: #ffffff;

      font-size:
        clamp(32px, 8vw, 46px);

      line-height: 1.08;

      font-weight: 800;

      letter-spacing: 1px;

      text-align: center;

      white-space: normal;

      overflow-wrap: anywhere;
    }

    .subtitle {
      width: 100%;

      margin: 10px 0 28px;

      color: #aeb9d0;

      font-size:
        clamp(16px, 4.5vw, 21px);

      line-height: 1.4;

      text-align: center;

      overflow-wrap: anywhere;
    }

    /* =====================================================
       FORM
       ===================================================== */

    #loginForm {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .form-group {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    label {
      display: block;

      width: 100%;

      margin: 18px 0 9px;

      color: #d7deef;

      font-size:
        clamp(16px, 4.5vw, 19px);

      line-height: 1.35;

      font-weight: 400;

      overflow-wrap: anywhere;
    }

    /* =====================================================
       INPUT WRAPPER
       ===================================================== */

    .input-wrapper {
      position: relative;

      width: 100%;

      display: block;
    }

    /* =====================================================
       INPUTS
       ===================================================== */

    input {
      display: block;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      height: 62px;

      margin: 0;
      padding: 0 18px;

      border: 1px solid transparent;

      border-radius: 18px;

      background: #edf2ff;

      color: #101828;

      font-family: inherit;

      font-size: 17px;

      line-height: 1.4;

      outline: none;

      -webkit-appearance: none;
      appearance: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input::placeholder {
      color: #737b8b;
      opacity: 1;
    }

    input:focus {
      background: #ffffff;

      border-color: #08a9ef;

      box-shadow:
        0 0 0 3px rgba(8, 169, 239, 0.18);
    }

    #password {
      padding-right: 62px;
    }

    /* =====================================================
       PASSWORD EYE BUTTON
       ===================================================== */

    .password-toggle {
      position: absolute;

      right: 7px;
      top: 50%;

      width: 48px;
      height: 48px;

      transform: translateY(-50%);

      margin: 0;
      padding: 0;

      border: 0;

      border-radius: 50%;

      background: transparent;

      color: #4b5870;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      line-height: 1;

      cursor: pointer;

      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

      z-index: 20;

      transition:
        background .15s ease,
        transform .15s ease;
    }

    .password-toggle:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .password-toggle:active {
      transform: translateY(-50%) scale(.92);
    }

    .password-toggle:focus {
      outline: 2px solid rgba(8, 169, 239, .45);
      outline-offset: 1px;
    }

    /* =====================================================
       LOGIN BUTTON
       ===================================================== */

    #loginBtn {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      min-height: 62px;

      margin: 26px 0 0;
      padding: 15px 14px;

      border: none;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #08a9ef 0%,
          #087de5 100%
        );

      color: #ffffff;

      font-family: inherit;

      font-size:
        clamp(18px, 5vw, 22px);

      line-height: 1.25;

      font-weight: 700;

      text-align: center;

      white-space: normal;

      overflow-wrap: anywhere;

      cursor: pointer;

      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

      box-shadow:
        0 9px 26px rgba(8, 142, 230, 0.28);

      transition:
        transform .15s ease,
        opacity .15s ease,
        box-shadow .15s ease;
    }

    #loginBtn:hover {
      box-shadow:
        0 12px 30px rgba(8, 142, 230, 0.38);
    }

    #loginBtn:active {
      transform: scale(.985);
    }

    #loginBtn:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    /* =====================================================
       LOGIN BUTTON LOADING
       ===================================================== */

    .button-spinner {
      width: 20px;
      height: 20px;

      margin-right: 10px;

      border: 2px solid rgba(255,255,255,.35);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        gridv21Spin .7s linear infinite;
    }

    @keyframes gridv21Spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       LOGIN MESSAGE
       ===================================================== */

    #loginMessage {
      width: 100%;

      margin-top: 16px;

      padding: 13px 14px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.5;

      text-align: center;

      overflow-wrap: anywhere;

      word-break: break-word;

      display: none;
    }

    #loginMessage.info {
      display: block;
      color: #67c7ff;
      background: rgba(8, 169, 239, .08);
      border: 1px solid rgba(8, 169, 239, .18);
    }

    #loginMessage.error {
      display: block;
      color: #ff7777;
      background: rgba(255, 75, 75, .08);
      border: 1px solid rgba(255, 75, 75, .18);
    }

    #loginMessage.success {
      display: block;
      color: #5ee58a;
      background: rgba(74, 222, 128, .08);
      border: 1px solid rgba(74, 222, 128, .18);
    }

    /* =====================================================
       SECURITY FOOTER
       ===================================================== */

    .security-footer {
      width: 100%;

      margin-top: 26px;

      color: #9ba9c4;

      font-size: 14px;

      line-height: 1.6;

      text-align: center;

      overflow-wrap: anywhere;
    }

    .security-footer .lock {
      color: #ffd166;
    }

    .copyright {
      margin-top: 14px;

      color: #64718d;

      font-size: 13px;

      line-height: 1.6;

      overflow-wrap: anywhere;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 420px) {

      body {
        padding:
          max(8px, env(safe-area-inset-top))
          6px
          max(16px, env(safe-area-inset-bottom))
          6px;
      }

      .login-card {
        padding: 22px 16px 26px;
        border-radius: 18px;
      }

      .grid-logo {
        width: 78px;
        height: 78px;
      }

      .brand-name {
        font-size: 34px;
      }

      .subtitle {
        margin-bottom: 21px;
        font-size: 16px;
      }

      label {
        font-size: 16px;
      }

      input {
        height: 58px;
        padding: 0 15px;
        font-size: 16px;
      }

      #password {
        padding-right: 58px;
      }

      .password-toggle {
        width: 46px;
        height: 46px;
      }

      #loginBtn {
        min-height: 58px;
        padding: 14px 10px;
      }

      .security-footer {
        font-size: 12px;
      }

      .copyright {
        font-size: 11px;
      }
    }

    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-width: 360px) {

      body {
        padding-left: 4px;
        padding-right: 4px;
      }

      .login-card {
        padding: 18px 12px 22px;
      }

      .grid-logo {
        width: 68px;
        height: 68px;
      }

      .brand-name {
        font-size: 30px;
      }

      input {
        height: 56px;
      }

      #loginBtn {
        min-height: 56px;
      }
    }

    /* =====================================================
       PREVENT IMAGE/SVG CROPPING
       ===================================================== */

    img,
    svg,
    canvas,
    video {
      max-width: 100%;
      height: auto;
    }

    /* =====================================================
       NEVER CLIP TEXT
       ===================================================== */

    h1,
    h2,
    h3,
    h4,
    p,
    span,
    div,
    label,
    button {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

  </style>
</head>

<body>

  <main class="login-card">

    <!-- =================================================
         GRIDV21 BRAND
         ================================================= -->

    <div class="brand">

      <svg
        class="grid-logo"
        viewBox="0 0 120 120"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="GRIDV21 Logo"
        role="img"
      >

        <defs>

          <linearGradient
            id="logoBlue"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#20c4ff"
            />

            <stop
              offset="100%"
              stop-color="#0876e8"
            />
          </linearGradient>

        </defs>

        <path
          d="M60 8 L99 30 L99 75 L60 98 L21 75 L21 30 Z"
          fill="none"
          stroke="url(#logoBlue)"
          stroke-width="10"
        />

        <path
          d="M79 38
             C73 30 64 26 54 26
             C38 26 28 38 28 53
             C28 68 39 79 54 79
             C65 79 74 74 79 66
             L79 53
             L56 53
             L56 62
             L68 62
             C65 67 60 69 54 69
             C44 69 38 62 38 53
             C38 43 45 36 54 36
             C61 36 67 39 71 44 Z"
          fill="url(#logoBlue)"
        />

        <text
          x="78"
          y="32"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20"
          font-weight="800"
          fill="#ffd166"
        >21</text>

      </svg>

      <h1 class="brand-name">
        GRIDV21
      </h1>

    </div>

    <div class="subtitle">
      Brain Enterprise — Secure Sign In
    </div>

    <!-- =================================================
         LOGIN FORM
         ================================================= -->

    <form
      id="loginForm"
      autocomplete="on"
      novalidate
    >

      <div class="form-group">

        <label for="email">
          Email address
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          inputmode="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="input-wrapper">

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            id="passwordToggle"
            class="password-toggle"
            aria-label="Show password"
            aria-pressed="false"
          >
            👁
          </button>

        </div>

      </div>

      <button
        type="submit"
        id="loginBtn"
      >
        Access GRIDV21
      </button>

    </form>

    <!-- Login response only.
         Diagnostics have deliberately been removed. -->

    <div
      id="loginMessage"
      role="alert"
      aria-live="polite"
    ></div>

    <!-- =================================================
         SECURITY FOOTER
         ================================================= -->

    <div class="security-footer">

      <span class="lock">🔒</span>
      Secure authentication powered by Supabase

      <div class="copyright">
        GRIDV21 VC MASTER BUILD V1<br>
        Intelligent Systems&nbsp; • &nbsp;
        Autonomous Future&nbsp; • &nbsp;
        Limitless Value
      </div>

    </div>

  </main>
  <!-- ===================================================
       GRIDV21 AUTHENTICATION ENGINE
       Direct Supabase REST API
       No CDN required
       =================================================== -->

  <script>

    /* =====================================================
       GRIDV21 CONFIGURATION
       ===================================================== */

    const SUPABASE_URL =
      "https://iatjgyrphrxeqaiqbpfb.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdGpneXJwaHJ4ZXFhaXFicGZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MTgxNjEsImV4cCI6MjA5MzE5NDE2MX0.sL1_y9VjvppM06p8DG5rybOLvROPuMyhYv4KG5IXhSw";

    const GRIDV21_API =
      "https://gridv21-api-brain-v2-1.onrender.com";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginMessage =
      document.getElementById("loginMessage");


    /* =====================================================
       MESSAGE HANDLER
       ===================================================== */

    function showMessage(message, type) {

      loginMessage.textContent = message;

      loginMessage.className = "";

      if (type) {
        loginMessage.classList.add(type);
      }

      loginMessage.style.display = "block";
    }


    function clearMessage() {

      loginMessage.textContent = "";

      loginMessage.className = "";

      loginMessage.style.display = "none";
    }


    /* =====================================================
       PASSWORD VISIBILITY
       ===================================================== */

    passwordToggle.addEventListener(
      "click",
      function (event) {

        event.preventDefault();
        event.stopPropagation();

        const isHidden =
          passwordInput.type === "password";

        if (isHidden) {

          passwordInput.type = "text";

          passwordToggle.textContent = "🙈";

          passwordToggle.setAttribute(
            "aria-label",
            "Hide password"
          );

          passwordToggle.setAttribute(
            "aria-pressed",
            "true"
          );

        } else {

          passwordInput.type = "password";

          passwordToggle.textContent = "👁";

          passwordToggle.setAttribute(
            "aria-label",
            "Show password"
          );

          passwordToggle.setAttribute(
            "aria-pressed",
            "false"
          );
        }

        passwordInput.focus();
      }
    );


    /* =====================================================
       BUTTON LOADING STATE
       ===================================================== */

    function setLoginLoading(loading) {

      if (loading) {

        loginBtn.disabled = true;

        loginBtn.innerHTML =
          '<span class="button-spinner"></span>' +
          'Connecting...';

      } else {

        loginBtn.disabled = false;

        loginBtn.textContent =
          "Access GRIDV21";
      }
    }


    /* =====================================================
       VALIDATE EMAIL
       ===================================================== */

    function validEmail(email) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);
    }


    /* =====================================================
       SUPABASE LOGIN
       ===================================================== */

    async function loginToGridv21() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      clearMessage();


      /* ---------------------------------------------------
         BASIC VALIDATION
         --------------------------------------------------- */

      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        emailInput.focus();

        return;
      }


      if (!validEmail(email)) {

        showMessage(
          "Please enter a valid email address.",
          "error"
        );

        emailInput.focus();

        return;
      }


      if (!password) {

        showMessage(
          "Please enter your password.",
          "error"
        );

        passwordInput.focus();

        return;
      }


      /* ---------------------------------------------------
         START LOGIN
         --------------------------------------------------- */

      setLoginLoading(true);

      showMessage(
        "Connecting securely to GRIDV21...",
        "info"
      );


      let timeoutId;


      try {

        const controller =
          new AbortController();


        timeoutId =
          setTimeout(
            function () {
              controller.abort();
            },
            20000
          );


        /* -----------------------------------------------
           SUPABASE PASSWORD AUTH
           ----------------------------------------------- */

        const response =
          await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=password",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_ANON_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_ANON_KEY,

                "Accept":
                  "application/json"
              },

              body: JSON.stringify({

                email:
                  email,

                password:
                  password
              }),

              signal:
                controller.signal
            }
          );


        clearTimeout(timeoutId);


        /* -----------------------------------------------
           READ RESPONSE
           ----------------------------------------------- */

        const responseText =
          await response.text();


        let result = {};


        try {

          result =
            responseText
              ? JSON.parse(responseText)
              : {};

        } catch (jsonError) {

          result = {};
        }


        console.log(
          "GRIDV21 Supabase HTTP:",
          response.status
        );


        console.log(
          "GRIDV21 Supabase response:",
          result
        );


        /* -----------------------------------------------
           SUCCESS
           ----------------------------------------------- */

        if (
          response.ok &&
          result.access_token
        ) {

          const accessToken =
            result.access_token;

          const refreshToken =
            result.refresh_token || "";

          const expiresIn =
            result.expires_in || 3600;

          const user =
            result.user || null;


          /* ---------------------------------------------
             SAVE SESSION
             --------------------------------------------- */

          const session = {

            access_token:
              accessToken,

            refresh_token:
              refreshToken,

            expires_in:
              expiresIn,

            token_type:
              result.token_type || "bearer",

            user:
              user,

            created_at:
              Date.now()
          };


          localStorage.setItem(
            "gridv21_session",
            JSON.stringify(session)
          );


          localStorage.setItem(
            "gridv21_access_token",
            accessToken
          );


          if (refreshToken) {

            localStorage.setItem(
              "gridv21_refresh_token",
              refreshToken
            );
          }


          if (user && user.id) {

            localStorage.setItem(
              "gridv21_user_id",
              user.id
            );
          }


          /* ---------------------------------------------
             SUCCESS MESSAGE
             --------------------------------------------- */

          showMessage(
            "Login successful. Opening GRIDV21...",
            "success"
          );


          /* ---------------------------------------------
             OPEN DASHBOARD
             --------------------------------------------- */

          setTimeout(
            function () {

              window.location.href =
                GRIDV21_API +
                "/dashboard";

            },
            700
          );


          return;
        }


        /* -----------------------------------------------
           SUPABASE ERROR
           ----------------------------------------------- */

        let errorMessage =
          "Login failed. Please check your email and password.";


        if (result.error_description) {

          errorMessage =
            result.error_description;

        } else if (result.msg) {

          errorMessage =
            result.msg;

        } else if (result.message) {

          errorMessage =
            result.message;
        }


        /* Friendlier common messages */

        const lowerError =
          String(errorMessage).toLowerCase();


        if (
          lowerError.includes(
            "invalid login credentials"
          )
        ) {

          errorMessage =
            "Invalid email or password.";

        } else if (
          lowerError.includes(
            "email not confirmed"
          )
        ) {

          errorMessage =
            "Your email address has not been confirmed.";

        } else if (
          lowerError.includes(
            "too many requests"
          )
        ) {

          errorMessage =
            "Too many login attempts. Please wait and try again.";

        }


        showMessage(
          errorMessage,
          "error"
        );


        setLoginLoading(false);

      } catch (error) {

        if (timeoutId) {
          clearTimeout(timeoutId);
        }


        console.error(
          "GRIDV21 login error:",
          error
        );


        /* ---------------------------------------------
           NETWORK / TIMEOUT ERROR
           --------------------------------------------- */

        if (
          error &&
          error.name === "AbortError"
        ) {

          showMessage(
            "Connection timed out. Please check your internet connection and try again.",
            "error"
          );

        } else {

          showMessage(
            "Unable to connect to GRIDV21 authentication. Please check your internet connection.",
            "error"
          );
        }


        setLoginLoading(false);
      }
    }


    /* =====================================================
       FORM SUBMISSION
       ===================================================== */

    loginForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        event.stopPropagation();

        loginToGridv21();
      }
    );


    /* =====================================================
       ENTER KEY SUPPORT
       ===================================================== */

    emailInput.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          event.preventDefault();

          loginToGridv21();
        }
      }
    );


    passwordInput.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          event.preventDefault();

          loginToGridv21();
        }
      }
    );


    /* =====================================================
       CHECK EXISTING SESSION
       ===================================================== */

    function checkExistingSession() {

      try {

        const saved =
          localStorage.getItem(
            "gridv21_session"
          );


        if (!saved) {
          return;
        }


        const session =
          JSON.parse(saved);


        if (
          session &&
          session.access_token
        ) {

          console.log(
            "GRIDV21 existing session detected."
          );
        }

      } catch (error) {

        console.warn(
          "GRIDV21 session check failed:",
          error
        );

      }
    }


    /* =====================================================
       PAGE INITIALIZATION
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        checkExistingSession();

        console.log(
          "GRIDV21 login system ready."
        );

      }
    );

  </script>
  <!-- ===================================================
       GRIDV21 FINAL SESSION / API HANDLING
       =================================================== -->

  <script>

    /* =====================================================
       OPTIONAL API HEALTH CHECK
       
       This does NOT appear on the login screen.
       It is only logged to the browser console.
       ===================================================== */

    async function checkGridv21API() {

      try {

        const response =
          await fetch(
            GRIDV21_API + "/api/health",
            {
              method: "GET",
              headers: {
                "Accept":
                  "application/json"
              },

              cache: "no-store"
            }
          );


        console.log(
          "GRIDV21 API status:",
          response.status
        );


      } catch (error) {

        console.warn(
          "GRIDV21 API health check unavailable:",
          error
        );

      }

    }


    /* =====================================================
       RESTORE SAVED ACCESS TOKEN
       ===================================================== */

    function getGridv21Token() {

      try {

        const token =
          localStorage.getItem(
            "gridv21_access_token"
          );

        return token || null;

      } catch (error) {

        console.warn(
          "Unable to read GRIDV21 session.",
          error
        );

        return null;
      }
    }


    /* =====================================================
       GLOBAL GRIDV21 SESSION OBJECT
       ===================================================== */

    window.GRIDV21 = {

      supabaseUrl:
        SUPABASE_URL,

      apiUrl:
        GRIDV21_API,

      getToken:
        getGridv21Token,

      getSession:
        function () {

          try {

            const session =
              localStorage.getItem(
                "gridv21_session"
              );

            return session
              ? JSON.parse(session)
              : null;

          } catch (error) {

            return null;
          }
        },

      logout:
        function () {

          localStorage.removeItem(
            "gridv21_session"
          );

          localStorage.removeItem(
            "gridv21_access_token"
          );

          localStorage.removeItem(
            "gridv21_refresh_token"
          );

          localStorage.removeItem(
            "gridv21_user_id"
          );

          window.location.href =
            "/login.html";
        }
    };


    /* =====================================================
       START API CHECK
       
       Console only.
       Nothing is displayed on the login screen.
       ===================================================== */

    checkGridv21API();


    /* =====================================================
       FINAL READY MESSAGE
       ===================================================== */

    console.log(
      "GRIDV21 Secure Login initialized."
    );

  </script>


</body>
