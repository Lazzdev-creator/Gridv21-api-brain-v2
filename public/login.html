<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071126">

  <title>GRIDV21 — Secure Sign In</title>

  <style>

    /* =====================================================
       GRIDV21 LOGIN — RESPONSIVE BASE
       ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #071126;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0;
      padding:
        max(12px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 0%,
          #193363 0%,
          #0b1835 42%,
          #071126 75%,
          #040a18 100%
        );

      display: flex;
      justify-content: center;
      align-items: flex-start;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* =====================================================
       MAIN LOGIN CARD
       ===================================================== */

    .login-card {
      width: 100%;
      max-width: 560px;

      margin: 0 auto;

      padding: 28px 22px 32px;

      background:
        linear-gradient(
          145deg,
          rgba(22, 39, 76, 0.98),
          rgba(8, 18, 42, 0.98)
        );

      border: 1px solid rgba(80, 145, 225, 0.35);

      border-radius: 22px;

      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

      overflow: visible;
    }

    /* =====================================================
       BRAND
       ===================================================== */

    .brand {
      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      margin: 0 0 8px;
    }

    /* Built-in SVG logo.
       No external image or CDN required. */

    .grid-logo {
      width: 92px;
      height: 92px;

      display: block;

      flex: 0 0 auto;

      margin: 0 auto 8px;

      overflow: visible;
    }

    .brand-name {
      width: 100%;

      margin: 0;

      color: #ffffff;

      font-size:
        clamp(32px, 8vw, 46px);

      line-height: 1.08;

      font-weight: 800;

      letter-spacing: 1px;

      text-align: center;

      white-space: normal;

      overflow-wrap: anywhere;
    }

    .subtitle {
      width: 100%;

      margin: 10px 0 28px;

      color: #aeb9d0;

      font-size:
        clamp(16px, 4.5vw, 21px);

      line-height: 1.4;

      text-align: center;

      overflow-wrap: anywhere;
    }

    /* =====================================================
       FORM
       ===================================================== */

    #loginForm {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .form-group {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    label {
      display: block;

      width: 100%;

      margin: 18px 0 9px;

      color: #d7deef;

      font-size:
        clamp(16px, 4.5vw, 19px);

      line-height: 1.35;

      font-weight: 400;

      overflow-wrap: anywhere;
    }

    /* =====================================================
       INPUT WRAPPER
       ===================================================== */

    .input-wrapper {
      position: relative;

      width: 100%;

      display: block;
    }

    /* =====================================================
       INPUTS
       ===================================================== */

    input {
      display: block;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      height: 62px;

      margin: 0;
      padding: 0 18px;

      border: 1px solid transparent;

      border-radius: 18px;

      background: #edf2ff;

      color: #101828;

      font-family: inherit;

      font-size: 17px;

      line-height: 1.4;

      outline: none;

      -webkit-appearance: none;
      appearance: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input::placeholder {
      color: #737b8b;
      opacity: 1;
    }

    input:focus {
      background: #ffffff;

      border-color: #08a9ef;

      box-shadow:
        0 0 0 3px rgba(8, 169, 239, 0.18);
    }

    #password {
      padding-right: 62px;
    }

    /* =====================================================
       PASSWORD EYE BUTTON
       ===================================================== */

    .password-toggle {
      position: absolute;

      right: 7px;
      top: 50%;

      width: 48px;
      height: 48px;

      transform: translateY(-50%);

      margin: 0;
      padding: 0;

      border: 0;

      border-radius: 50%;

      background: transparent;

      color: #4b5870;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      line-height: 1;

      cursor: pointer;

      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

      z-index: 20;

      transition:
        background .15s ease,
        transform .15s ease;
    }

    .password-toggle:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .password-toggle:active {
      transform: translateY(-50%) scale(.92);
    }

    .password-toggle:focus {
      outline: 2px solid rgba(8, 169, 239, .45);
      outline-offset: 1px;
    }

    /* =====================================================
       LOGIN BUTTON
       ===================================================== */

    #loginBtn {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      min-height: 62px;

      margin: 26px 0 0;
      padding: 15px 14px;

      border: none;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #08a9ef 0%,
          #087de5 100%
        );

      color: #ffffff;

      font-family: inherit;

      font-size:
        clamp(18px, 5vw, 22px);

      line-height: 1.25;

      font-weight: 700;

      text-align: center;

      white-space: normal;

      overflow-wrap: anywhere;

      cursor: pointer;

      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

      box-shadow:
        0 9px 26px rgba(8, 142, 230, 0.28);

      transition:
        transform .15s ease,
        opacity .15s ease,
        box-shadow .15s ease;
    }

    #loginBtn:hover {
      box-shadow:
        0 12px 30px rgba(8, 142, 230, 0.38);
    }

    #loginBtn:active {
      transform: scale(.985);
    }

    #loginBtn:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    /* =====================================================
       LOGIN BUTTON LOADING
       ===================================================== */

    .button-spinner {
      width: 20px;
      height: 20px;

      margin-right: 10px;

      border: 2px solid rgba(255,255,255,.35);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        gridv21Spin .7s linear infinite;
    }

    @keyframes gridv21Spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       LOGIN MESSAGE
       ===================================================== */

    #loginMessage {
      width: 100%;

      margin-top: 16px;

      padding: 13px 14px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.5;

      text-align: center;

      overflow-wrap: anywhere;

      word-break: break-word;

      display: none;
    }

    #loginMessage.info {
      display: block;
      color: #67c7ff;
      background: rgba(8, 169, 239, .08);
      border: 1px solid rgba(8, 169, 239, .18);
    }

    #loginMessage.error {
      display: block;
      color: #ff7777;
      background: rgba(255, 75, 75, .08);
      border: 1px solid rgba(255, 75, 75, .18);
    }

    #loginMessage.success {
      display: block;
      color: #5ee58a;
      background: rgba(74, 222, 128, .08);
      border: 1px solid rgba(74, 222, 128, .18);
    }

    /* =====================================================
       SECURITY FOOTER
       ===================================================== */

    .security-footer {
      width: 100%;

      margin-top: 26px;

      color: #9ba9c4;

      font-size: 14px;

      line-height: 1.6;

      text-align: center;

      overflow-wrap: anywhere;
    }

    .security-footer .lock {
      color: #ffd166;
    }

    .copyright {
      margin-top: 14px;

      color: #64718d;

      font-size: 13px;

      line-height: 1.6;

      overflow-wrap: anywhere;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 420px) {

      body {
        padding:
          max(8px, env(safe-area-inset-top))
          6px
          max(16px, env(safe-area-inset-bottom))
          6px;
      }

      .login-card {
        padding: 22px 16px 26px;
        border-radius: 18px;
      }

      .grid-logo {
        width: 78px;
        height: 78px;
      }

      .brand-name {
        font-size: 34px;
      }

      .subtitle {
        margin-bottom: 21px;
        font-size: 16px;
      }

      label {
        font-size: 16px;
      }

      input {
        height: 58px;
        padding: 0 15px;
        font-size: 16px;
      }

      #password {
        padding-right: 58px;
      }

      .password-toggle {
        width: 46px;
        height: 46px;
      }

      #loginBtn {
        min-height: 58px;
        padding: 14px 10px;
      }

      .security-footer {
        font-size: 12px;
      }

      .copyright {
        font-size: 11px;
      }
    }

    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-width: 360px) {

      body {
        padding-left: 4px;
        padding-right: 4px;
      }

      .login-card {
        padding: 18px 12px 22px;
      }

      .grid-logo {
        width: 68px;
        height: 68px;
      }

      .brand-name {
        font-size: 30px;
      }

      input {
        height: 56px;
      }

      #loginBtn {
        min-height: 56px;
      }
    }

    /* =====================================================
       PREVENT IMAGE/SVG CROPPING
       ===================================================== */

    img,
    svg,
    canvas,
    video {
      max-width: 100%;
      height: auto;
    }

    /* =====================================================
       NEVER CLIP TEXT
       ===================================================== */

    h1,
    h2,
    h3,
    h4,
    p,
    span,
    div,
    label,
    button {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

  </style>
</head>

<body>

  <main class="login-card">

    <!-- =================================================
         GRIDV21 BRAND
         ================================================= -->

    <div class="brand">

      <svg
        class="grid-logo"
        viewBox="0 0 120 120"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="GRIDV21 Logo"
        role="img"
      >

        <defs>

          <linearGradient
            id="logoBlue"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#20c4ff"
            />

            <stop
              offset="100%"
              stop-color="#0876e8"
            />
          </linearGradient>

        </defs>

        <path
          d="M60 8 L99 30 L99 75 L60 98 L21 75 L21 30 Z"
          fill="none"
          stroke="url(#logoBlue)"
          stroke-width="10"
        />

        <path
          d="M79 38
             C73 30 64 26 54 26
             C38 26 28 38 28 53
             C28 68 39 79 54 79
             C65 79 74 74 79 66
             L79 53
             L56 53
             L56 62
             L68 62
             C65 67 60 69 54 69
             C44 69 38 62 38 53
             C38 43 45 36 54 36
             C61 36 67 39 71 44 Z"
          fill="url(#logoBlue)"
        />

        <text
          x="78"
          y="32"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20"
          font-weight="800"
          fill="#ffd166"
        >21</text>

      </svg>

      <h1 class="brand-name">
        GRIDV21
      </h1>

    </div>

    <div class="subtitle">
      Brain Enterprise — Secure Sign In
    </div>

    <!-- =================================================
         LOGIN FORM
         ================================================= -->

    <form
      id="loginForm"
      autocomplete="on"
      novalidate
    >

      <div class="form-group">

        <label for="email">
          Email address
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          inputmode="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="input-wrapper">

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            id="passwordToggle"
            class="password-toggle"
            aria-label="Show password"
            aria-pressed="false"
          >
            👁
          </button>

        </div>

      </div>

      <button
        type="submit"
        id="loginBtn"
      >
        Access GRIDV21
      </button>

    </form>

    <!-- Login response only.
         Diagnostics have deliberately been removed. -->

    <div
      id="loginMessage"
      role="alert"
      aria-live="polite"
    ></div>

    <!-- =================================================
         SECURITY FOOTER
         ================================================= -->

    <div class="security-footer">

      <span class="lock">🔒</span>
      Secure authentication powered by Supabase

      <div class="copyright">
        GRIDV21 VC MASTER BUILD V1<br>
        Intelligent Systems&nbsp; • &nbsp;
        Autonomous Future&nbsp; • &nbsp;
        Limitless Value
      </div>

    </div>

  </main>
